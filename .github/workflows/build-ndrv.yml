name: Build qemu_vga.ndrv (Retro68)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Apple's Universal Interfaces & Libraries 3.x (with AppleDouble resource
      # forks for the PPC shared-library stubs), pinned to the commit of
      # brunocastello/iWordle that added them.
      - name: Checkout Universal Interfaces
        uses: actions/checkout@v4
        with:
          repository: brunocastello/iWordle
          ref: 7483dbeddd5d8c9d73bb362c24ad70ce5d6d7f45
          path: sdk
          sparse-checkout: third_party/InterfacesAndLibraries

      - name: Build with Retro68
        run: |
          docker pull -q ghcr.io/autc04/retro68
          echo "Retro68 image: $(docker image inspect --format '{{index .RepoDigests 0}}' ghcr.io/autc04/retro68)"
          docker run --rm -v "$PWD:/src" -w /src/QemuVGADriver -i ghcr.io/autc04/retro68 /bin/bash <<'EOF'
          set -e
          /Retro68-build/bin/interfaces-and-libraries.sh /Retro68-build/toolchain /src/sdk/third_party/InterfacesAndLibraries
          powerpc-apple-macos-gcc --version | head -1
          make
          ls -l build
          EOF

      - name: Inspect output
        run: |
          f=QemuVGADriver/build/qemu_vga.ndrv
          ls -l "$f" builds/qemu_vga.ndrv
          echo "PEF header:"; xxd -l 64 "$f"
          for s in DoDriverIO TheDriverDescription; do
            grep -q "$s" "$f" && echo "export string present: $s" || { echo "::error::missing $s"; exit 1; }
          done
          sha256sum "$f"

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: qemu_vga.ndrv
          path: QemuVGADriver/build/qemu_vga.ndrv

  # DG_LAYOUT (SHA-256 of the Mavericks gliDispatch.h) and the GL opcode
  # numbers come from VirtualIntelMac's generator run on the 10.9 SDK, exactly
  # as UTM/guest-kit/intel/build-mojave-kit.sh does. Runs on macOS; the Retro68
  # job below only consumes the small generated header.
  glhello-header:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch VirtualIntelMac (pinned) and the 10.9 SDK
        env:
          VIM_COMMIT: 2861da9e265e557aef90319e4451487ed1fed553   # VirtualIntelMac 2.2
          SDK_URL: https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.9.sdk.tar.xz
          SDK_SHA256: fcf88ce8ff0dd3248b97f4eb81c7909f2cc786725de277f4d05a2b935cc49de0
        run: |
          set -e
          git clone -q --filter=blob:none --no-checkout https://github.com/nfzerox/VirtualIntelMacOnAppleSilicon.git "$RUNNER_TEMP/vim"
          git -C "$RUNNER_TEMP/vim" checkout -q "$VIM_COMMIT" -- Source/scripts Source/PassthroughOpenGL
          curl -sfL -o "$RUNNER_TEMP/sdk.tar.xz" "$SDK_URL"
          echo "$SDK_SHA256  $RUNNER_TEMP/sdk.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP"

      - name: Generate glhello_gen.h
        run: |
          set -e
          python3 -I "$RUNNER_TEMP/vim/Source/scripts/generate-passthrough-opengl.py" \
            "$RUNNER_TEMP/MacOSX10.9.sdk" "$RUNNER_TEMP/glpair" > /dev/null
          GLHello/gen-glhello-header.sh "$RUNNER_TEMP/glpair" "$RUNNER_TEMP/glhello_gen.h"

      - uses: actions/upload-artifact@v4
        with:
          name: glhello-gen-header
          path: ${{ runner.temp }}/glhello_gen.h

  glhello:
    needs: glhello-header
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: glhello-gen-header
          path: GLHello

      # CodeFragments.h / Folders.h for the CFM probe (and InterfaceLib stubs).
      - name: Checkout Universal Interfaces
        uses: actions/checkout@v4
        with:
          repository: brunocastello/iWordle
          ref: 7483dbeddd5d8c9d73bb362c24ad70ce5d6d7f45
          path: sdk
          sparse-checkout: third_party/InterfacesAndLibraries

      - name: Build GLHello with Retro68 (PowerPC)
        run: |
          docker pull -q ghcr.io/autc04/retro68
          docker run --rm -v "$PWD:/src" -w /src/GLHello -i ghcr.io/autc04/retro68 /bin/bash <<'EOF2'
          set -e
          /Retro68-build/bin/interfaces-and-libraries.sh /Retro68-build/toolchain /src/sdk/third_party/InterfacesAndLibraries
          command -v cmake >/dev/null || { apt-get update -qq && apt-get install -y -qq cmake; }
          TC=$(find /Retro68-build/toolchain -name retroppc.toolchain.cmake | head -1)
          echo "toolchain file: $TC"
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="$TC"
          grep -rl NewGWorld /Retro68-build/toolchain/powerpc-apple-macos/include | head -3
          make
          ls -l
          chmod -R a+rwX /src/GLHello/build
          EOF2

      - name: Inspect output
        run: |
          ls -l GLHello/build
          test -s GLHello/build/GLHello.bin
          test -s GLHello/build/GLHello.dsk
          sha256sum GLHello/build/GLHello.bin GLHello/build/GLHello.dsk

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: GLHello
          path: |
            GLHello/build/GLHello.bin
            GLHello/build/GLHello.dsk
            GLHello/glhello_gen.h

  # Client encoder for the OS 9 OpenGLLibrary. Runs VirtualIntelMac's generator
  # (MIT, pinned) three times: unpatched, patched without the flag (must be
  # byte-identical to unpatched), and patched with VIM_GEN_ELEMENT_WIDTH=1,
  # which emits the per-payload element width a big-endian guest needs.
  opengl-codegen:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch VirtualIntelMac (pinned) and the 10.9 SDK
        env:
          VIM_COMMIT: 2861da9e265e557aef90319e4451487ed1fed553   # VirtualIntelMac 2.2
          SDK_URL: https://github.com/phracker/MacOSX-SDKs/releases/download/11.3/MacOSX10.9.sdk.tar.xz
          SDK_SHA256: fcf88ce8ff0dd3248b97f4eb81c7909f2cc786725de277f4d05a2b935cc49de0
        run: |
          set -e
          git clone -q --filter=blob:none --no-checkout https://github.com/nfzerox/VirtualIntelMacOnAppleSilicon.git "$RUNNER_TEMP/vim"
          git -C "$RUNNER_TEMP/vim" checkout -q "$VIM_COMMIT" -- Source/scripts Source/PassthroughOpenGL
          curl -sfL -o "$RUNNER_TEMP/sdk.tar.xz" "$SDK_URL"
          echo "$SDK_SHA256  $RUNNER_TEMP/sdk.tar.xz" | shasum -a 256 -c -
          tar -xf "$RUNNER_TEMP/sdk.tar.xz" -C "$RUNNER_TEMP"

      - name: Generate with the unpatched generator
        run: |
          set -e
          python3 -I "$RUNNER_TEMP/vim/Source/scripts/generate-passthrough-opengl.py" \
            "$RUNNER_TEMP/MacOSX10.9.sdk" "$RUNNER_TEMP/gen-orig" | tee "$RUNNER_TEMP/orig.log"

      - name: Apply vim-ppc-element-width.patch (must apply cleanly)
        run: |
          set -e
          git -C "$RUNNER_TEMP/vim" apply --check "$GITHUB_WORKSPACE/OpenGLLibrary/vim/vim-ppc-element-width.patch"
          git -C "$RUNNER_TEMP/vim" apply "$GITHUB_WORKSPACE/OpenGLLibrary/vim/vim-ppc-element-width.patch"

      - name: Generate patched, flag unset, and prove byte-identity
        run: |
          set -e
          G="$RUNNER_TEMP/vim/Source/scripts/generate-passthrough-opengl.py"
          python3 -I "$G" "$RUNNER_TEMP/MacOSX10.9.sdk" "$RUNNER_TEMP/gen-default" | tee "$RUNNER_TEMP/default.log"
          diff -r "$RUNNER_TEMP/gen-orig" "$RUNNER_TEMP/gen-default"
          diff "$RUNNER_TEMP/orig.log" "$RUNNER_TEMP/default.log"
          echo "flag unset: output byte-identical to the unpatched generator ($(ls "$RUNNER_TEMP/gen-orig" | wc -l | tr -d ' ') files)"

      - name: Generate patched with VIM_GEN_ELEMENT_WIDTH=1
        run: |
          set -e
          G="$RUNNER_TEMP/vim/Source/scripts/generate-passthrough-opengl.py"
          VIM_GEN_ELEMENT_WIDTH=1 python3 -I "$G" "$RUNNER_TEMP/MacOSX10.9.sdk" "$RUNNER_TEMP/gen-ppc" \
            > "$RUNNER_TEMP/ppc.log" 2> "$RUNNER_TEMP/ppc.err"
          cat "$RUNNER_TEMP/ppc.log" "$RUNNER_TEMP/ppc.err"
          # Only the client encoder may differ from the unpatched output; the
          # rest of the flagged output must be unchanged plus the two new files.
          diff -rq "$RUNNER_TEMP/gen-orig" "$RUNNER_TEMP/gen-ppc" | sort > "$RUNNER_TEMP/ppc.diff" || true
          cat "$RUNNER_TEMP/ppc.diff"
          test "$(wc -l < "$RUNNER_TEMP/ppc.diff" | tr -d ' ')" = 3
          grep -q 'direct-client-generated.inc differ' "$RUNNER_TEMP/ppc.diff"
          grep -q 'Only in .*direct-element-width.inc' "$RUNNER_TEMP/ppc.diff"
          grep -q 'Only in .*opengl-codegen-ppc.json' "$RUNNER_TEMP/ppc.diff"
          # Every payload helper call must now be a W variant.
          if grep -E '\bDG(PacketPointer|PacketOutput|PacketQueryInput|PackEvaluatorPoints|PacketIncludeString|PacketCopy)\(' "$RUNNER_TEMP/gen-ppc/direct-client-generated.inc"; then echo "unwidened payload call left"; exit 1; fi
          echo "W calls: $(grep -oE 'DG(PacketPointer|PacketOutput|PacketQueryInput|PackEvaluatorPoints|PacketIncludeString|PacketCopy)W\(' "$RUNNER_TEMP/gen-ppc/direct-client-generated.inc" | wc -l | tr -d ' ')"
          grep -E 'void glLoadMatrixf|DGPacketPointerW\(&packet,0,m' "$RUNNER_TEMP/gen-ppc/direct-client-generated.inc" | head -3 || true
          grep -E 'DGPacketPointerW.*pixels' "$RUNNER_TEMP/gen-ppc/direct-client-generated.inc" | head -3 || true

      - name: Collect
        run: |
          set -e
          O="$RUNNER_TEMP/codegen-out"
          mkdir -p "$O/ppc" "$O/original"
          for f in direct-client-generated.inc direct-opcodes.h direct-layout.h direct-lookup.inc direct-declarations.inc \
                   direct-element-width.inc opengl-codegen-ppc.json passthrough-opengl-gli-map.json direct-coverage.json; do
            cp "$RUNNER_TEMP/gen-ppc/$f" "$O/ppc/$f"
          done
          for f in direct-client-generated.inc direct-opcodes.h direct-layout.h direct-lookup.inc direct-declarations.inc \
                   passthrough-opengl-gli-map.json; do
            cp "$RUNNER_TEMP/gen-orig/$f" "$O/original/$f"
          done
          # Inputs of the OS 9 library build (job opengl-library): the get-count
          # tables, VIM's two query-count includes (MIT) and the GL enum numbers.
          cp "$RUNNER_TEMP/gen-ppc/direct-get-counts.inc" "$O/ppc/"
          for f in server-state-query-counts.inc additional-state-query-counts.inc; do
            cp "$RUNNER_TEMP/vim/Source/PassthroughOpenGL/$f" "$O/ppc/$f"
          done
          python3 -I "$GITHUB_WORKSPACE/OpenGLLibrary/gen-glenums.py" "$RUNNER_TEMP/MacOSX10.9.sdk" "$O/ppc/glenum-values.h"
          cp "$GITHUB_WORKSPACE/OpenGLLibrary/vim/vim-ppc-element-width.patch" "$O/"
          cp "$RUNNER_TEMP/ppc.err" "$O/generator-ppc.stderr.txt"
          cp "$RUNNER_TEMP/ppc.diff" "$O/flagged-vs-original.diff.txt"
          ls -lR "$O"

      - uses: actions/upload-artifact@v4
        with:
          name: opengl-codegen-ppc
          path: ${{ runner.temp }}/codegen-out

  # The Mac OS 9 OpenGLLibrary replacement (CFM shared library, PowerPC,
  # Retro68): generated gl* encoders from opengl-codegen + our DG client over
  # the PVMAC ring + AGL. Output: MacBinary 'shlb' with a cfrg resource.
  opengl-library:
    needs: opengl-codegen
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: opengl-codegen-ppc
          path: codegen

      - name: Generate the export wrappers
        run: |
          set -e
          ls codegen codegen/ppc
          python3 -I OpenGLLibrary/gen-gl-exports.py codegen/ppc OpenGLLibrary/gen
          wc -l OpenGLLibrary/gen/gl_generated.c OpenGLLibrary/gen/OpenGLLibrary.exp

      - name: Build OpenGLLibrary with Retro68 (PowerPC)
        run: |
          docker pull -q ghcr.io/autc04/retro68
          docker run --rm -v "$PWD:/src" -w /src/OpenGLLibrary -i ghcr.io/autc04/retro68 /bin/bash <<'EOF2'
          set -e
          command -v cmake >/dev/null || { apt-get update -qq && apt-get install -y -qq cmake; }
          command -v python3 >/dev/null || { apt-get update -qq && apt-get install -y -qq python3; }
          TC=$(find /Retro68-build/toolchain -name retroppc.toolchain.cmake | head -1)
          echo "toolchain file: $TC"
          powerpc-apple-macos-gcc --version | head -1
          mkdir -p build && cd build
          cmake .. -DCMAKE_TOOLCHAIN_FILE="$TC"
          make VERBOSE=1
          ls -l
          chmod -R a+rwX /src/OpenGLLibrary/build /src/OpenGLLibrary/gen
          EOF2

      - name: Inspect output
        run: |
          set -e
          ls -l OpenGLLibrary/build
          python3 -I OpenGLLibrary/check-pef.py OpenGLLibrary/build/OpenGLLibrary.pef \
            OpenGLLibrary/gen/OpenGLLibrary.exp OpenGLLibrary/build/OpenGLLibrary.bin
          sha256sum OpenGLLibrary/build/OpenGLLibrary.bin

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: OpenGLLibrary-os9
          path: |
            OpenGLLibrary/build/OpenGLLibrary.bin
            OpenGLLibrary/build/OpenGLLibrary.dsk
            OpenGLLibrary/build/OpenGLLibrary.pef
            OpenGLLibrary/gen/OpenGLLibrary.exp
